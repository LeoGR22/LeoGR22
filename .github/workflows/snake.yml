name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#6d28d9&color_dots=#ebedf0,#ddd6fe,#a78bfa,#7c3aed,#4c1d95
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#161b22,#2e1065,#4c1d95,#6d28d9,#a78bfa

      - name: Push to output branch
        run: |
          # dist/ is created as root by the Docker action, so publish from a copy
          mkdir -p "$RUNNER_TEMP/snake"
          cp dist/*.svg "$RUNNER_TEMP/snake/"
          cd "$RUNNER_TEMP/snake"
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update snake"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
